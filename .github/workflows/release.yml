name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get latest release version
        id: current_version
        run: |
          # Use GitHub API to find the latest release tag (works even with shallow clone)
          TAG=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
            | python3 -c "import sys,json; r=json.load(sys.stdin); print(r.get('tag_name',''))" 2>/dev/null)
          if [ -z "$TAG" ]; then
            echo "version=0.1.0" >> $GITHUB_OUTPUT
            echo "tag_name=v0.1.0" >> $GITHUB_OUTPUT
          else
            echo "version=${TAG#v}" >> $GITHUB_OUTPUT
            echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          fi

      - name: Read manifest version
        id: manifest
        run: |
          MANIFEST_VER=$(grep '"version"' manifest.json | sed 's/.*"version": "\([^"]*\)".*/\1/')
          echo "version=$MANIFEST_VER" >> $GITHUB_OUTPUT

      - name: Check if release needed
        id: needs_release
        run: |
          CURRENT="${{ steps.current_version.outputs.version }}"
          MANIFEST="${{ steps.manifest.outputs.version }}"
          echo "current=$CURRENT manifest=$MANIFEST"
          # Compare versions: if manifest > current, release is needed
          if printf '%s\n%s\n' "$CURRENT" "$MANIFEST" | sort -V -r | head -1 | grep -q "^$MANIFEST$"; then
            echo "needed=true" >> $GITHUB_OUTPUT
          else
            echo "needed=false" >> $GITHUB_OUTPUT
          fi

      - name: Build extension zip
        run: |
          zip -r thanos-tabs.zip manifest.json background.js popup.html popup.js icons/

      - name: Create GitHub Release
        if: steps.needs_release.outputs.needed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.manifest.outputs.version }}
          name: Thanos Tabs v${{ steps.manifest.outputs.version }}
          body: |
            ## What's New

            Version ${{ steps.manifest.outputs.version }}
          files: thanos-tabs.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Note: softprops/action-gh-release automatically creates the tag from tag_name
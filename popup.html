<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      width: 280px;
      padding: 20px;
      background: #1e1e2e;
      color: #cdd6f4;
    }
    h1 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #cdd6f4;
    }
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    label {
      font-size: 14px;
      color: #a6adc8;
    }
    input[type="number"] {
      width: 70px;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid #313244;
      background: #313244;
      color: #cdd6f4;
      font-size: 14px;
      text-align: right;
    }
    input[type="number"]:focus {
      outline: none;
      border-color: #7c3aed;
    }
    .snap-btn {
      width: 100%;
      padding: 10px;
      background: #7c3aed;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
.snap-btn:hover {
  background: #6d28d9;
}

.toggle {
  position: relative;
  display: inline-block;
  width: 40px;
  height: 22px;
}
.toggle input { opacity: 0; width: 0; height: 0; }
.slider {
  position: absolute;
  cursor: pointer;
  inset: 0;
  background: #313244;
  border-radius: 22px;
  transition: background 0.2s;
}
.slider::before {
  content: '';
  position: absolute;
  height: 16px;
  width: 16px;
  left: 3px;
  bottom: 3px;
  background: white;
  border-radius: 50%;
  transition: transform 0.2s;
}
.toggle input:checked + .slider {
  background: #7c3aed;
}
.toggle input:checked + .slider::before {
  transform: translateX(18px);
}
    .status {
      margin-top: 12px;
      font-size: 12px;
      color: #6c7086;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Thanos Tabs</h1>

  <div class="setting-row">
    <label for="enabled">Enabled</label>
    <label class="toggle">
      <input type="checkbox" id="enabled" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="setting-row">
    <label for="minKept">Always keep at least</label>
    <div style="display: flex; align-items: center; gap: 4px;">
      <input type="number" id="minKept" min="0" max="1000" value="0">
      <span style="font-size: 13px; color: #a6adc8;">tabs</span>
    </div>
  </div>

  <div class="setting-row">
    <label for="interval">Snap every</label>
    <div style="display: flex; align-items: center; gap: 4px;">
      <input type="number" id="interval" min="1" max="1440" value="5">
      <span style="font-size: 13px; color: #a6adc8;">min</span>
    </div>
  </div>

  <button class="snap-btn" id="snap-now">Snap Now</button>

  <div class="status" id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
